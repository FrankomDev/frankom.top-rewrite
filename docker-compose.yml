services:

  db:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${PASSWORD}
      MYSQL_DATABASE: frankomtop
    networks:
      - app

  api:
    image: backend
    restart: always
    environment:
      PASSWORD: ${PASSWORD}
    volumes:
      - ./img/:/app/backend/img/
    networks:
      - app

  nginx:
    image: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app

networks:
  app:
    external: false
