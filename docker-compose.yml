services:

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${PASSWORD}
      MARIADB_DATABASE: frankomtop
    networks:
      - app

  api:
    image: backend
    restart: always
    volumes:
      - ./img/:/app/backend/img/
    networks:
      - app
    env_file: ".env"

  nginx:
    image: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/:/etc/letsencrypt/
      - /var/www/html/:/var/www/html/
    networks:
      - app

networks:
  app:
    external: false
