<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frankom.top</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body> 
    <div style="display: flex; flex-direction: column; width: 75%; margin: auto; gap: 10px;">
        <nav id="nav" class="box" style="display: flex; justify-content: center;">
            <a href="/"> <button>main</button> </a>
            <a href="/hardware"> <button>hardware</button> </a>
            <a href="/blog"> <button>blog</button> </a>
            <a href="/socials"> <button>socials</button> </a>
        </nav>

        <div id="msg" class="box" style="font-size: larger;">
            <h1 style="text-align: center;">{{post[0]}}</h1>
            <h3 style="text-align: center;">{{post[1]}}</h3>
            <hr width="60%" style="color: wheat; background-color: wheat; border-color: wheat;"> 
            <div id="post-content" style="font-size: x-large; padding: 5px; color: wheat; font-family: monospace;">
                
            </div>
            <!--<a href="#"><button class="post">29.11.2025 - Blog testowy</button></a><br>
            <a href="#"><button class="post">29.11.2025 - Blog testowy</button></a><br>-->
        </div>
    </div>
    
    <script>
        document.getElementById("post-content").innerHTML = marked.parse(`{{post[2]}}`)
    </script>
</body>
</html>
